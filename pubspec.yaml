name: karen_next
description: Sinkit — Persian RTL smart GSM controller application, formerly KAREN Next (inspired by Karen Electronic 1.0.0).
publish_to: 'none'
version: 2.2.0+5

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/google_fonts/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
